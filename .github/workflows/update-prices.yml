name: Update PoE2 currency prices

on:
  schedule:
    # Stuendlich, passend zum Update-Rhythmus der poe.ninja PoE2-Daten
    - cron: "5 * * * *"
  workflow_dispatch: {}   # erlaubt manuellen Start über den "Actions"-Tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preise abrufen
        run: python fetch_prices.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name "poe2-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Daten."
          else
            git commit -m "Preise aktualisiert: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
