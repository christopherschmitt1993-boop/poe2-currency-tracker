<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoE2 Currency Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110f;
    --surface: #1d1913;
    --surface-alt: #262019;
    --border: #3a2f22;
    --gold: #c8973c;
    --gold-bright: #e6b95c;
    --rust: #9a4b3a;
    --text: #ece3d2;
    --text-muted: #a89a83;
    --up: #6ea86e;
    --down: #b5584a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 0%, rgba(200,151,60,0.08), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(154,75,58,0.08), transparent 40%);
    min-height: 100vh;
  }

  header {
    padding: 2.5rem 1.5rem 1.25rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.9rem;
    letter-spacing: 0.02em;
    color: var(--gold-bright);
    margin: 0 0 0.35rem;
  }

  .tabs {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.5rem;
    display: flex;
    gap: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    padding: 0.9rem 0.1rem;
    cursor: pointer;
    position: relative;
  }

  .tab-btn:hover { color: var(--text); }

  .tab-btn.active { color: var(--gold-bright); }

  .tab-btn.active::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 2px;
    background: var(--gold);
  }

  .tab-panel[hidden] { display: none; }

  .subline {
    color: var(--text-muted);
    font-size: 0.95rem;
    max-width: 1100px;
    margin: 1.25rem auto 0;
    padding: 0 1.5rem;
  }

  .rates-bar {
    max-width: 1100px;
    margin: 1.25rem auto 0;
    padding: 0 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .rate-pill {
    flex: 1;
    min-width: 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.9rem 1.1rem 1rem;
  }

  .rate-pill .header-currency {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    letter-spacing: 0.03em;
    color: var(--gold-bright);
    padding-bottom: 0.6rem;
    margin-bottom: 0.55rem;
    border-bottom: 1px solid var(--border);
  }

  .rate-pill .header-currency img {
    width: 26px;
    height: 26px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .rate-pill .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 0.25rem 0;
  }

  .rate-pill .row .orb-name {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    text-align: left;
    color: var(--text-muted);
    font-size: 1rem;
  }

  .rate-pill .row .orb-name img {
    width: 20px;
    height: 20px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .rate-pill .row .value {
    flex: 0 0 auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    min-width: 4.5rem;
    text-align: left;
  }

  .controls {
    max-width: 1100px;
    margin: 1.5rem auto 0;
    padding: 0 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
  }

  select, input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 0.9rem;
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
  }

  select:focus, input[type="text"]:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  input[type="text"] { flex: 1; min-width: 180px; }

  main {
    max-width: 1100px;
    margin: 1.5rem auto 3rem;
    padding: 0 1.5rem;
  }

  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95rem;
    min-width: 720px;
  }

  thead th {
    text-align: left;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 0.8rem;
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  thead th.sortable {
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  thead th.sortable:hover { color: var(--text); }

  thead th.sortable .sort-arrow {
    display: inline-block;
    margin-left: 0.25rem;
    color: var(--gold);
    font-size: 0.75rem;
    width: 0.8em;
  }

  thead th.num, td.num { text-align: right; }

  tbody tr {
    border-bottom: 1px solid rgba(58,47,34,0.5);
  }

  tbody tr:hover { background: var(--surface); }

  td { padding: 0.65rem 0.75rem; }

  td.item-name {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  td.item-name img {
    width: 24px;
    height: 24px;
    object-fit: contain;
  }

  td.num {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
  }

  .trend {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
  }

  .trend.up { color: var(--up); }
  .trend.down { color: var(--down); }
  .trend.flat { color: var(--text-muted); }

  th.trend-head { min-width: 4.2rem; }

  footer {
    max-width: 1100px;
    margin: 0 auto 2rem;
    padding: 0 1.5rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .state-msg {
    color: var(--text-muted);
    padding: 2rem 0;
    font-size: 0.95rem;
  }

  .state-msg.error { color: var(--down); }

  /* ===== Map Tracker ===== */
  .map-tracker {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    color: var(--gold-bright);
    letter-spacing: 0.02em;
    margin: 2rem 0 0.75rem;
  }

  .section-title:first-of-type { margin-top: 0; }

  .hint-text {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin: -0.4rem 0 0.75rem;
  }

  .hint-inline {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 0.8rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .field label {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .field select, .field input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.55rem 0.7rem;
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
  }

  .field select:focus, .field input:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .map-settings-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(120px, 1fr));
    gap: 0.6rem;
    overflow-x: auto;
  }

  .map-settings-grid .field label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .map-settings-grid select, .map-settings-grid input {
    padding: 0.45rem 0.5rem;
    font-size: 0.82rem;
  }

  /* --- Tablet Slots --- */
  .tablet-slots {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1rem;
  }

  .tablet-slot {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.9rem;
  }

  .tablet-slot .slot-label {
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  .tablet-slot select {
    width: 100%;
    margin-bottom: 0.6rem;
  }

  .tablet-mods-box {
    max-height: 180px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    padding-top: 0.5rem;
  }

  .mod-group-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0.4rem 0 0.25rem;
  }

  .add-mod-btn {
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    font-size: 0.66rem;
    text-transform: none;
    letter-spacing: normal;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    cursor: pointer;
  }

  .add-mod-btn:hover { background: var(--gold); color: #1a1408; }

  .mod-checkbox {
    display: flex;
    align-items: flex-start;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--text);
    padding: 0.15rem 0;
    cursor: pointer;
  }

  .mod-checkbox input { margin-top: 0.2rem; flex-shrink: 0; }

  .mod-row {
    display: flex;
    align-items: flex-start;
    gap: 0.35rem;
    font-size: 0.78rem;
    color: var(--text);
    padding: 0.2rem 0;
    line-height: 1.5;
  }

  .remove-mod-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--down);
    cursor: pointer;
    font-size: 0.75rem;
    padding: 0 0.15rem;
    line-height: 1.5;
  }

  .remove-mod-btn:hover { color: #e07a6a; }

  .mod-text { display: inline; }

  .roll-input {
    width: 3.4rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--gold-bright);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    text-align: center;
    padding: 0.1rem 0.2rem;
    margin: 0 0.25rem;
  }

  .roll-input:focus {
    outline: 1px solid var(--gold);
    outline-offset: 0;
  }

  /* Solange kein eigener Wert eingetragen ist, zeigt der Platzhalter die
     Original-Rollrange in einer gedaempften, hell wirkenden Goldfarbe an. */
  .roll-input::placeholder {
    color: var(--gold);
    opacity: 0.55;
  }

  .unique-tablet-box {
    font-size: 0.78rem;
    color: var(--text);
    line-height: 1.5;
  }

  .unique-tablet-box .implicit {
    color: var(--gold-bright);
    margin-bottom: 0.35rem;
  }

  .unique-tablet-box ul { margin: 0; padding-left: 1.1rem; }

  /* --- Category grid (Currency Tracker Miniaturansicht) --- */
  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 0.6rem;
  }

  .category-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.7rem 0.5rem;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .category-tile:hover { border-color: var(--gold); color: var(--gold-bright); }

  /* --- Collection list --- */
  .collection-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    min-height: 3rem;
  }

  .collection-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.55rem 0.9rem;
    border-bottom: 1px solid rgba(58,47,34,0.5);
    font-size: 0.9rem;
  }

  .collection-row:last-child { border-bottom: none; }

  .collection-row .drop-name { color: var(--text); }
  .collection-row .drop-qty {
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold-bright);
    margin-left: 0.6rem;
  }

  .delete-drop-btn {
    background: none;
    border: none;
    color: var(--down);
    cursor: pointer;
    font-size: 1rem;
    padding: 0.1rem 0.4rem;
  }

  .delete-drop-btn:hover { color: #e07a6a; }

  /* --- Save row --- */
  .save-row {
    margin-top: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }

  .primary-btn {
    background: var(--gold);
    color: #1a1408;
    border: none;
    border-radius: 4px;
    padding: 0.65rem 1.4rem;
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  .primary-btn:hover { background: var(--gold-bright); }

  .save-status { color: var(--up); font-size: 0.85rem; }

  /* --- Modals --- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1rem;
  }

  .modal-overlay[hidden] { display: none; }

  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .modal-box-small { max-width: 280px; }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Cinzel', serif;
    color: var(--gold-bright);
    font-size: 0.95rem;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1rem;
  }

  .modal-close:hover { color: var(--text); }

  .modal-box input[type="text"], .modal-box input[type="number"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.55rem 0.7rem;
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
  }

  .modal-list {
    overflow-y: auto;
    max-height: 320px;
    border-top: 1px solid var(--border);
    padding-top: 0.4rem;
  }

  .collection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 0.6rem;
    padding: 0.9rem;
  }

  .collection-tile {
    position: relative;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.3rem 0.4rem;
    text-align: center;
  }

  .collection-tile img, .collection-tile .item-icon-fallback {
    width: 30px;
    height: 30px;
    object-fit: contain;
  }

  .collection-tile .item-icon-fallback {
    display: inline-block;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #efe1c0, var(--gold) 70%);
  }

  .collection-tile .qty-badge {
    display: block;
    margin-top: 0.3rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--gold-bright);
  }

  .collection-tile .tile-delete {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    line-height: 16px;
    border-radius: 50%;
    background: var(--down);
    color: #fff;
    border: none;
    font-size: 0.7rem;
    cursor: pointer;
    padding: 0;
  }

  .collection-tile .tile-delete:hover { background: #e07a6a; }

  .modal-list-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.4rem;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 3px;
  }

  .modal-list-item img, .modal-list-item .item-icon-fallback {
    width: 22px;
    height: 22px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .modal-list-item .item-icon-fallback {
    display: inline-block;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #efe1c0, var(--gold) 70%);
  }

  .modal-list-item:hover { background: var(--surface-alt); color: var(--gold-bright); }
</style>
</head>
<body>

<header>
  <h1>PoE2 Tracker</h1>
</header>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="currency" role="tab" aria-selected="true">Currency Tracker</button>
  <button class="tab-btn" data-tab="maps" role="tab" aria-selected="false">Map Tracker</button>
</nav>

<section id="tab-currency" class="tab-panel" role="tabpanel">
  <div class="subline" id="leagueLine">Lade Ligadaten …</div>

  <div class="rates-bar" id="ratesBar"></div>

  <div class="controls">
    <select id="leagueSelect" aria-label="Liga auswählen"></select>
    <select id="categorySelect" aria-label="Kategorie auswählen"></select>
    <input type="text" id="searchInput" placeholder="Item suchen …">
  </div>

  <main>
    <div id="content" class="table-wrap">
      <div class="state-msg">Lade Preisdaten …</div>
    </div>
  </main>

  <footer id="footerNote"></footer>
</section>

<section id="tab-maps" class="tab-panel" role="tabpanel" hidden>
  <div class="map-tracker">

    <h2 class="section-title">Map Settings</h2>
    <div class="map-settings-grid">
      <div class="field">
        <label for="specialMapSelect">Special Map</label>
        <select id="specialMapSelect"></select>
      </div>
      <div class="field">
        <label for="mapTierSelect">Map Tier</label>
        <select id="mapTierSelect"></select>
      </div>
      <div class="field">
        <label for="statItemRarity">Item Rarity %</label>
        <input type="number" id="statItemRarity" placeholder="0">
      </div>
      <div class="field">
        <label for="statPackSize">Pack Size %</label>
        <input type="number" id="statPackSize" placeholder="0">
      </div>
      <div class="field">
        <label for="statMonsterRarity">Monster Rarity %</label>
        <input type="number" id="statMonsterRarity" placeholder="0">
      </div>
      <div class="field">
        <label for="statMonsterEff">Monster Effectiveness %</label>
        <input type="number" id="statMonsterEff" placeholder="0">
      </div>
      <div class="field">
        <label for="statWaystoneChance">Waystone Drop Chance %</label>
        <input type="number" id="statWaystoneChance" placeholder="0">
      </div>
    </div>

    <h2 class="section-title">Tablets</h2>
    <div class="tablet-slots" id="tabletSlots"></div>

    <h2 class="section-title">Drops erfassen</h2>
    <p class="hint-text">Kategorie anklicken, Item wählen, Menge eingeben und mit Enter bestätigen.</p>
    <div class="category-grid" id="categoryGrid"></div>

    <h2 class="section-title">
      Sammelfenster <span class="hint-inline">(aktueller Map-Run)</span>
    </h2>
    <div id="collectionList" class="collection-list collection-grid">
      <div class="state-msg">Noch keine Drops erfasst.</div>
    </div>

    <div class="save-row">
      <button id="saveRunBtn" class="primary-btn">Run speichern</button>
      <span id="saveStatus" class="save-status"></span>
    </div>

  </div>
</section>

<!-- Modal: Item aus Kategorie waehlen -->
<div id="itemPickerModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-header">
      <span id="itemPickerTitle">Item wählen</span>
      <button class="modal-close" onclick="closeItemPicker()">✕</button>
    </div>
    <input type="text" id="itemPickerSearch" placeholder="Item suchen …">
    <div id="itemPickerList" class="modal-list"></div>
  </div>
</div>

<!-- Modal: Praefix/Suffix zum Tablet hinzufuegen -->
<div id="modPickerModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-header">
      <span id="modPickerTitle">Mod hinzufügen</span>
      <button class="modal-close" onclick="closeModPicker()">✕</button>
    </div>
    <input type="text" id="modPickerSearch" placeholder="Mod suchen …">
    <div id="modPickerList" class="modal-list"></div>
  </div>
</div>

<!-- Modal: Menge eingeben -->
<div id="qtyModal" class="modal-overlay" hidden>
  <div class="modal-box modal-box-small">
    <div class="modal-header">
      <span id="qtyModalTitle">Menge</span>
      <button class="modal-close" onclick="closeQtyModal()">✕</button>
    </div>
    <input type="number" id="qtyInput" placeholder="Menge" min="0" step="1">
    <button class="primary-btn" onclick="confirmQty()">Bestätigen (Enter)</button>
  </div>
</div>

<script src="tablet-data.js"></script>
<script>
const DATA_URL = './data/latest.json';
let fullData = null;
let sortState = { key: 'chaos', dir: 'desc' };

async function loadData() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    fullData = await res.json();
    initUI();
  } catch (err) {
    document.getElementById('content').innerHTML =
      '<div class="state-msg error">Konnte data/latest.json nicht laden. ' +
      'Läuft das Fetch-Skript / der GitHub-Actions-Workflow schon einmal? (' +
      err.message + ')</div>';
  }
}

function currentLeague() {

}

function initUI() {
  const leagueSelect = document.getElementById('leagueSelect');
  const leagueIds = Object.keys(fullData.leagues);

function populateCategorySelect() {

  const previous = select.value;

function currencyIconMap() {
  const map = {};
  const currencyItems = (currentLeague().categories && currentLeague().categories['Currency']) || [];
  for (const item of currencyItems) {
    if (item.id === 'divine' || item.id === 'chaos' || item.id === 'exalted') {
      map[item.id] = item.icon;
    }
  }
  return map;
}

function renderRatesBar() {
  const r = currentLeague().exchangeRates || {};
  const bar = document.getElementById('ratesBar');
  const icons = currencyIconMap();

  const names = { divine: 'Divine Orb', chaos: 'Chaos Orb', exalted: 'Exalted Orb' };
  // Priorisierung: Divine > Chaos > Exalted - gilt fuer die Zeilenreihenfolge
  // innerhalb jeder Kachel (die Basiswaehrung der Kachel selbst faellt weg).
  const priority = ['divine', 'chaos', 'exalted'];

  const iconTag = (id) => icons[id]
    ? `<img src="https://web.poecdn.com${icons[id]}" alt="" loading="lazy">` : '';

  bar.innerHTML = priority.map(base => {
    const rates = r[base] || {};
    const otherCurrencies = priority.filter(c => c !== base);

    const rows = otherCurrencies.map(c => `
      <div class="row">
        <span class="orb-name">${iconTag(c)}<span>${names[c]}</span></span>
        <span class="value">${rates[c] != null ? fmt(rates[c]) : '–'}</span>
      </div>
    `).join('');

    return `
      <div class="rate-pill">
        <div class="header-currency">${iconTag(base)}<span>1x ${names[base]}</span></div>
        ${rows}
      </div>
    `;
  }).join('');
}

function trendMarkup(pct) {
  if (pct === null || pct === undefined) return '<span class="trend flat">–</span>';
  const rounded = Math.round(pct * 10) / 10;
  const cls = rounded > 0.5 ? 'up' : rounded < -0.5 ? 'down' : 'flat';
  const sign = rounded > 0 ? '+' : '';
  return `<span class="trend ${cls}">${sign}${rounded}%</span>`;
}

function fmt(value) {
  if (value === null || value === undefined) return '–';
  if (value === 0) return '0';
  if (value >= 100) return value.toFixed(1);
  if (value >= 1) return value.toFixed(2);
  return value.toFixed(4);
}

function sortValue(item, key) {
  if (key === 'name') return item.name.toLowerCase();
  if (key === 'divine' || key === 'chaos' || key === 'exalted') {
    return item.values ? item.values[key] : null;
  }
  return item.trend ? item.trend[key] : null; // Trend-Zeitfenster (1h/3h/3d/7d)
}

function compareItems(a, b, key, dir) {
  const va = sortValue(a, key);
  const vb = sortValue(b, key);
  const aMissing = va === null || va === undefined;
  const bMissing = vb === null || vb === undefined;
  if (aMissing && bMissing) return 0;
  if (aMissing) return 1;  // fehlende Werte immer ans Ende
  if (bMissing) return -1;

  const cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
  return dir === 'asc' ? cmp : -cmp;
}

function setSort(key) {
  if (sortState.key === key) {
    sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
  } else {
    sortState.key = key;
    // sinnvoller Default: Namen aufsteigend, Zahlen absteigend (hoechster Wert zuerst)
    sortState.dir = key === 'name' ? 'asc' : 'desc';
  }
  render();
}

function sortArrow(key) {
  if (sortState.key !== key) return '';
  return sortState.dir === 'asc' ? '▲' : '▼';
}

function render() {
  const category = document.getElementById('categorySelect').value;
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const items = (currentLeague().categories[category] || [])
    .filter(item => !search || item.name.toLowerCase().includes(search));

  items.sort((a, b) => compareItems(a, b, sortState.key, sortState.dir));

  if (items.length === 0) {
    document.getElementById('content').innerHTML =
      '<div class="state-msg">Keine Items gefunden.</div>';
    return;
  }

  // Reihenfolge der Preis-Spalten nach Prioritaet: Divine > Chaos > Exalted
  const currencyOrder = ['divine', 'chaos', 'exalted'];
  const currencyLabel = { divine: 'Divine', chaos: 'Chaos', exalted: 'Exalted' };
  const trendWindows = fullData.trendWindows || ['1h', '3h', '3d', '7d'];

  const rows = items.map(item => {
    const priceCells = currencyOrder
      .map(c => `<td class="num">${fmt(item.values[c])}</td>`).join('');
    const trendCells = trendWindows
      .map(w => `<td class="num">${trendMarkup(item.trend ? item.trend[w] : null)}</td>`).join('');

    return `
      <tr>
        <td class="item-name">
          ${item.icon ? `<img src="https://web.poecdn.com${item.icon}" alt="" loading="lazy">` : ''}
          ${item.name}
        </td>
        ${priceCells}
        ${trendCells}
      </tr>
    `;
  }).join('');

  const nameHeader =
    `<th class="sortable" onclick="setSort('name')">Item<span class="sort-arrow">${sortArrow('name')}</span></th>`;
  const priceHeaders = currencyOrder.map(c => `
    <th class="num sortable" onclick="setSort('${c}')">${currencyLabel[c]}<span class="sort-arrow">${sortArrow(c)}</span></th>
  `).join('');
  const trendHeaders = trendWindows.map(w => `
    <th class="num sortable trend-head" onclick="setSort('${w}')">${w}<span class="sort-arrow">${sortArrow(w)}</span></th>
  `).join('');

  document.getElementById('content').innerHTML = `
    <table>
      <thead>
        <tr>
          ${nameHeader}
          ${priceHeaders}
          ${trendHeaders}
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');

      document.querySelectorAll('.tab-panel').forEach(p => { p.hidden = true; });
      document.getElementById('tab-' + btn.dataset.tab).hidden = false;
    });
  });
}

// TODO (vorgemerkt): Tablet-Icons links vom Namen im Dropdown ergaenzen, sobald

// ausserhalb der Wiki). Stattdessen entweder vom Nutzer bereitgestellte
// Screenshots als Data-URI einbetten, oder eigene Symbole erstellen.
function renderTabletSlots() {
  const container = document.getElementById('tabletSlots');
  container.innerHTML = currentRun.tablets.map((slot, idx) => {
    const artOptions = ['<option value="">— wählen —</option>']
      .concat(Object.entries(TABLET_TYPES).map(([key, t]) =>
        `<option value="${key}" ${slot.artKey === key ? 'selected' : ''}>${t.label}</option>`))
      .concat([`<option value="unique" ${slot.artKey === 'unique' ? 'selected' : ''}>— Unique Tablet —</option>`])
      .join('');

    return `
      <div class="tablet-slot">
        <div class="slot-label">Tablet ${idx + 1}</div>
        <select onchange="setTabletArt(${idx}, this.value)">${artOptions}</select>
        <div id="tabletModsBox${idx}">${renderTabletModsBox(slot, idx)}</div>
      </div>
    `;
  }).join('');
}

function renderTabletModsBox(slot, idx) {
  if (!slot.artKey) {
    return '<div class="hint-text" style="margin:0;">Erst eine Tablet-Art wählen.</div>';
  }

  if (slot.artKey === 'unique') {
    const uniqueOptions = ['<option value="">— Unique wählen —</option>']
      .concat(UNIQUE_TABLETS.map(u =>
        `<option value="${u.name}" ${slot.uniqueName === u.name ? 'selected' : ''}>${u.name} (${TABLET_TYPES[u.type].label})</option>`))
      .join('');

    const chosen = UNIQUE_TABLETS.find(u => u.name === slot.uniqueName);
    const detail = chosen ? `
      <div class="unique-tablet-box">
        <div class="implicit">${chosen.implicit}</div>
        ${chosen.mods.map((m, mi) => renderActiveModRow(idx, 'unique', mi, m, slot, false)).join('')}
      </div>
    ` : '';

    return `
      <select onchange="setTabletUnique(${idx}, this.value)">${uniqueOptions}</select>
      ${detail}
    `;
  }

  const type = TABLET_TYPES[slot.artKey];

  const prefixRows = slot.activePrefixes.map(pi =>
    renderActiveModRow(idx, 'prefix', pi, PREFIX_POOL[pi], slot, true)).join('');
  const suffixRows = slot.activeSuffixes.map(si =>
    renderActiveModRow(idx, 'suffix', si, type.suffixes[si], slot, true)).join('');

  return `
    <div class="tablet-mods-box">
      <div class="mod-group-label">
        Präfixe
        <button type="button" class="add-mod-btn" onclick="openModPicker(${idx}, 'prefix')">+ hinzufügen</button>
      </div>
      ${prefixRows || '<div class="hint-text" style="margin:0.2rem 0;">Keine Präfixe hinzugefügt.</div>'}

      <div class="mod-group-label">
        Suffixe
        <button type="button" class="add-mod-btn" onclick="openModPicker(${idx}, 'suffix')">+ hinzufügen</button>
      </div>
      ${suffixRows || '<div class="hint-text" style="margin:0.2rem 0;">Keine Suffixe hinzugefügt.</div>'}
    </div>
  `;
}

// Zerlegt eine Mod-Zeile in Text-vor-der-Range / Range-Inhalt / Text-nach-der-Range.
// Beispiel: "(10-15)% increased Pack Size" -> before="", rangeHint="10-15", after="% increased Pack Size"
function parseModLine(text) {
  const m = text.match(/\(([^)]+)\)/);
  if (!m) return { hasRange: false, before: text, rangeHint: null, after: '' };
  return {
    hasRange: true,
    before: text.slice(0, m.index),
    rangeHint: m[1],
    after: text.slice(m.index + m[0].length),
  };
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escapeAttr(str) {
  return str.replace(/"/g, '&quot;');
}

// Rendert eine bereits hinzugefuegte, aktive Mod-Zeile.
// Hat die Zeile eine Roll-Range -> Eingabefeld, Platzhalter zeigt die Original-Range
// hell/gedaempft an (siehe CSS .roll-input::placeholder). Kein Min/Max-Limit auf dem
// Feld, damit auch Werte ausserhalb der Range (corrupted Tablet) eingetragen werden koennen.
// removable=true zeigt einen X-Button zum Entfernen (nicht bei Unique-Tablet-Mods,
// die sind fix vorgegeben und nicht einzeln entfernbar).
function renderActiveModRow(idx, group, modIdx, text, slot, removable) {
  const parsed = parseModLine(text);
  const rollsKey = group + 'Rolls';
  const removeBtn = removable
    ? `<button type="button" class="remove-mod-btn" onclick="removeMod(${idx}, '${group}', ${modIdx})" title="Entfernen">✕</button>`
    : '';

  if (parsed.hasRange) {
    const val = (slot[rollsKey] && slot[rollsKey][modIdx]) || '';
    return `
      <div class="mod-row">
        ${removeBtn}
        <span class="mod-text">${escapeHtml(parsed.before)}<input
          type="text" inputmode="decimal" class="roll-input"
          placeholder="${escapeAttr(parsed.rangeHint)}" value="${escapeAttr(val)}"
          oninput="setModRoll(${idx}, '${group}', ${modIdx}, this.value)"
        >${escapeHtml(parsed.after)}</span>
      </div>
    `;
  }

  return `
    <div class="mod-row">
      ${removeBtn}
      <span class="mod-text">${escapeHtml(text)}</span>
    </div>
  `;
}

function setTabletArt(idx, artKey) {
  currentRun.tablets[idx] = {
    artKey,
    activePrefixes: [], prefixRolls: {},
    activeSuffixes: [], suffixRolls: {},
    uniqueRolls: {}, uniqueName: '',
  };
  document.getElementById('tabletModsBox' + idx).innerHTML =
    renderTabletModsBox(currentRun.tablets[idx], idx);
}

function setModRoll(idx, group, modIdx, value) {
  const slot = currentRun.tablets[idx];
  const key = group + 'Rolls';
  if (!slot[key]) slot[key] = {};
  slot[key][modIdx] = value;
}

function removeMod(idx, group, modIdx) {
  const slot = currentRun.tablets[idx];
  const listKey = group === 'prefix' ? 'activePrefixes' : 'activeSuffixes';
  slot[listKey] = slot[listKey].filter(i => i !== modIdx);
  delete slot[group + 'Rolls'][modIdx];
  document.getElementById('tabletModsBox' + idx).innerHTML = renderTabletModsBox(slot, idx);
}

function setTabletUnique(idx, uniqueName) {
  currentRun.tablets[idx].uniqueName = uniqueName;
  currentRun.tablets[idx].uniqueRolls = {};
  document.getElementById('tabletModsBox' + idx).innerHTML =
    renderTabletModsBox(currentRun.tablets[idx], idx);
}

let modPickerState = { tabletIdx: null, group: null };

function openModPicker(tabletIdx, group) {
  modPickerState = { tabletIdx, group };
  const slot = currentRun.tablets[tabletIdx];
  const groupLabel = group === 'prefix' ? 'Präfix' : 'Suffix';
  document.getElementById('modPickerTitle').textContent = `${groupLabel} hinzufügen`;
  document.getElementById('modPickerSearch').value = '';
  renderModPickerList('');
  document.getElementById('modPickerModal').hidden = false;
  document.getElementById('modPickerSearch').focus();
}

function getModPool(tabletIdx, group) {
  const slot = currentRun.tablets[tabletIdx];
  if (group === 'prefix') return PREFIX_POOL;
  return TABLET_TYPES[slot.artKey].suffixes;
}

function renderModPickerList(filterText) {
  const { tabletIdx, group } = modPickerState;
  const slot = currentRun.tablets[tabletIdx];
  const pool = getModPool(tabletIdx, group);
  const activeList = group === 'prefix' ? slot.activePrefixes : slot.activeSuffixes;

  const remaining = pool
    .map((text, i) => ({ text, i }))
    .filter(entry => !activeList.includes(entry.i))
    .filter(entry => entry.text.toLowerCase().includes(filterText.toLowerCase()));

  const listEl = document.getElementById('modPickerList');
  if (remaining.length === 0) {
    listEl.innerHTML = '<div class="hint-text">Keine weiteren Mods gefunden (oder schon alle hinzugefügt).</div>';
    return;
  }
  listEl.innerHTML = remaining.map(entry => `
    <div class="modal-list-item" onclick="addMod(${entry.i})">${escapeHtml(entry.text)}</div>
  `).join('');
}

function addMod(poolIdx) {
  const { tabletIdx, group } = modPickerState;
  const slot = currentRun.tablets[tabletIdx];
  const listKey = group === 'prefix' ? 'activePrefixes' : 'activeSuffixes';
  if (!slot[listKey].includes(poolIdx)) slot[listKey].push(poolIdx);

  document.getElementById('tabletModsBox' + tabletIdx).innerHTML = renderTabletModsBox(slot, tabletIdx);
  renderModPickerList(document.getElementById('modPickerSearch').value);
}

function closeModPicker() {
  document.getElementById('modPickerModal').hidden = true;
}

function confirmQty() {
  const qtyInput = document.getElementById('qtyInput');
  const qty = Number(qtyInput.value);
  if (!qty || qty <= 0) { qtyInput.focus(); return; }

  const labels = fullData.categoryLabels || {};

    category: qtyState.category,
    categoryLabel: labels[qtyState.category] || qtyState.category,
    itemId: qtyState.item.id,
    itemName: qtyState.item.name,
    icon: qtyState.item.icon || null,
    qty,
  });

  closeQtyModal();
  renderCollectionList();
}

function renderCollectionList() {
  const listEl = document.getElementById('collectionList');
  if (currentRun.drops.length === 0) {
    listEl.innerHTML = '<div class="state-msg">Noch keine Drops erfasst.</div>';
    return;
  }
  listEl.innerHTML = currentRun.drops.map((drop, idx) => `
    <div class="collection-tile" title="${escapeAttr(drop.itemName)} (${escapeAttr(drop.categoryLabel)})">
      <button class="tile-delete" onclick="deleteDrop(${idx})" title="Position löschen">✕</button>
      ${drop.icon
        ? `<img src="https://web.poecdn.com${drop.icon}" alt="" loading="lazy">`
        : `<span class="item-icon-fallback"></span>`}
      <span class="qty-badge">${drop.qty}x</span>
    </div>
  `).join('');
}

function deleteDrop(idx) {
  currentRun.drops.splice(idx, 1);
  renderCollectionList();
}

// ---------- Speichern ----------

function saveRun() {
  const statusEl = document.getElementById('saveStatus');

  if (currentRun.drops.length === 0) {
    statusEl.textContent = 'Keine Drops erfasst – nichts zu speichern.';
    statusEl.style.color = 'var(--down)';
    return;
  }

  const record = {
    ...currentRun,
    savedAt: new Date().toISOString(),
    league: currentLeague() ? currentLeague().name : null,
  };

  try {
    const raw = localStorage.getItem(MAP_RUNS_STORAGE_KEY);
    const runs = raw ? JSON.parse(raw) : [];
    runs.push(record);
    localStorage.setItem(MAP_RUNS_STORAGE_KEY, JSON.stringify(runs));

    statusEl.style.color = 'var(--up)';
    statusEl.textContent = `Gespeichert ✓ (insgesamt ${runs.length} Run(s) in diesem Browser)`;

    currentRun = createEmptyRun();
    resetMapSettingsUI();
    renderTabletSlots();
    renderCollectionList();
  } catch (err) {
    statusEl.style.color = 'var(--down)';
    statusEl.textContent = 'Fehler beim Speichern: ' + err.message;
  }
}

function initMapTracker() {
  initMapSettingsUI();
  renderTabletSlots();
  renderCollectionList();
  document.getElementById('saveRunBtn').addEventListener('click', saveRun);

  // Kategorie-Grid haengt von den Currency-Daten ab - erst befuellen,
  // sobald fullData/League bereit sind (siehe renderCategoryGridWhenReady).
}

initTabs();
loadData();
initMapTracker();
</script>
